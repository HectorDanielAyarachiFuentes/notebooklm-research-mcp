<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NotebookLM Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 348px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .logo-icon {
      width: 22px;
      height: 22px;
      border-radius: 5px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-weight: 600;
    }
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 10px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 8px;
      font-size: 11px;
      color: #cbd5e1;
    }
    select {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .secondary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }
    .btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #1d4ed8, #4338ca);
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.28);
      box-shadow: none;
      font-size: 11px;
      padding: 9px 10px;
      color: #e2e8f0;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #334155;
    }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.45;
      display: none;
      text-align: left;
    }
    .status.success {
      display: block;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.32);
      color: #4ade80;
    }
    .status.warning {
      display: block;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
    }
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.32);
      color: #f87171;
    }
    .count {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 8px;
    }
    .details {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="NotebookLM Sync" class="logo-icon">
    <h1>NotebookLM Sync</h1>
    <span class="badge">v2.0</span>
  </div>
  <p class="subtitle">Exporta o copia tus cookies completas con dominios y flags exactos para Antigravity MCP.</p>

  <div class="mode-row">
    <label for="autoMode">Al abrir copiar:</label>
    <select id="autoMode">
      <option value="state_json">state.json (Playwright MCP)</option>
      <option value="header">Cookie Header (Legacy/txt)</option>
      <option value="manual">No copiar automáticamente</option>
    </select>
  </div>

  <div class="actions">
    <button id="copyStateBtn" class="btn">
      <span>📋</span> Copiar state.json (MCP v2)
    </button>
    <div class="secondary-row">
      <button id="downloadStateBtn" class="btn btn-secondary">
        <span>💾</span> Guardar state.json
      </button>
      <button id="copyHeaderBtn" class="btn btn-secondary">
        <span>🔗</span> Copiar Header
      </button>
    </div>
  </div>

  <div id="status" class="status"></div>
  <div id="count" class="count"></div>
  <div id="details" class="details"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
